<!doctype html>
<html
	lang="zh-CN"
	class="bg-(--ui-bg-layout)">
	<head>
		<meta charset="UTF-8" />
		<link
			rel="icon"
			type="image/x-icon"
			href="/favicon.ico" />
		<!-- <meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" /> -->
		<!--
		  说明：
		  该 viewport 设置让移动端页面整体缩小显示，能看到更多内容。
		  initial-scale=0.5 表示页面初始缩放为50%，minimum-scale=0.3 允许最小缩放到30%，maximum-scale=1.0 允许最大放大到100%，user-scalable=yes 允许用户手动缩放。
		  PC端基本无影响，仅移动端浏览器会生效。
		-->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=0.5, minimum-scale=0.3, maximum-scale=1.0, user-scalable=yes" />
		<link
			rel="manifest"
			href="/manifest.json" />
		<title></title>
	</head>
	<body>
		<div id="app"></div>
		<script
			type="module"
			src="/src/main.js"></script>
	</body>
</html>
